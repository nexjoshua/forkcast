      <stop offset="0" stop-color="#13235C"/>
      <stop offset="1" stop-color="#2A4BB0"/>
    </linearGradient>
    <linearGradient id="fc-fork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B3D"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <radialGradient id="fc-glow" cx=".75" cy=".2" r=".6">

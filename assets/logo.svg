    <rect x="248" y="146" width="16" height="66" rx="8"/>
    <rect x="276" y="146" width="16" height="66" rx="8"/>
    <path d="M220 196h72v6a36 36 0 0 1-36 36 36 36 0 0 1-36-36z"/>
